name: CI/CD Pipeline

permissions:
  contents: read
  security-events: write   # Required for uploading Trivy SARIF to GitHub Security tab

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev
      - 'feature/**'

jobs:
  # ─── Frontend CI ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  # ─── Backend CI ──────────────────────────────────────────────────────────────
  build-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies (production + test)
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest --tb=short -q --cov=app --cov-report=xml

      - name: Upload coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ─── Docker Build & Push ─────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    needs: [build-frontend, build-backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    outputs:
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/employee-management-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/employee-management-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ─── Security Scanning ───────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    needs: [docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/employee-management-backend:${{ needs.docker.outputs.image-tag }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload backend SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/employee-management-frontend:${{ needs.docker.outputs.image-tag }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload frontend SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # ─── Kubernetes Deploy ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes (Minikube)
    needs: [docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: stable

      - uses: azure/setup-kubectl@v3

      - name: Verify cluster connectivity
        run: |
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespaces

      - name: Apply namespace
        run: kubectl apply -f kubernetes/00-namespace.yaml

      - name: Create Kubernetes secret
        run: |
          kubectl create secret generic ems-ops-secrets \
            --namespace=ems-ops \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.K8S_POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="${{ secrets.K8S_DATABASE_URL }}" \
            --from-literal=SECRET_KEY="${{ secrets.K8S_SECRET_KEY }}" \
            --from-literal=ADMIN_PASSWORD="${{ secrets.K8S_ADMIN_PASSWORD }}" \
            --from-literal=GRAFANA_PASSWORD="${{ secrets.K8S_GRAFANA_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply all manifests
        run: kubectl apply -k kubernetes/

      - name: Wait for database
        run: |
          kubectl rollout status statefulset/ems-ops-db -n ems-ops --timeout=300s || {
            echo "──── pod list ────"
            kubectl get pods -n ems-ops -o wide
            echo "──── describe db pod ────"
            kubectl describe pod -l app=ems-ops-db -n ems-ops
            echo "──── db logs ────"
            kubectl logs -l app=ems-ops-db -n ems-ops --tail=60 || true
            exit 1
          }

      - name: Deploy backend (rolling update)
        run: |
          kubectl set image deployment/ems-ops-backend \
            backend=${{ secrets.DOCKER_USERNAME }}/employee-management-backend:${{ needs.docker.outputs.image-tag }} \
            -n ems-ops
          kubectl rollout status deployment/ems-ops-backend -n ems-ops --timeout=300s || {
            echo "──── pod list ────"
            kubectl get pods -n ems-ops -o wide
            echo "──── describe backend pods ────"
            kubectl describe pod -l app=ems-ops-backend -n ems-ops
            echo "──── backend logs ────"
            kubectl logs -l app=ems-ops-backend -n ems-ops --tail=60 || true
            exit 1
          }

      - name: Deploy frontend (rolling update)
        run: |
          kubectl set image deployment/ems-ops-frontend \
            frontend=${{ secrets.DOCKER_USERNAME }}/employee-management-frontend:${{ needs.docker.outputs.image-tag }} \
            -n ems-ops
          kubectl rollout status deployment/ems-ops-frontend -n ems-ops --timeout=300s || {
            echo "──── pod list ────"
            kubectl get pods -n ems-ops -o wide
            echo "──── describe frontend pods ────"
            kubectl describe pod -l app=ems-ops-frontend -n ems-ops
            echo "──── frontend logs ────"
            kubectl logs -l app=ems-ops-frontend -n ems-ops --tail=60 || true
            exit 1
          }

      - name: Post-deployment health check
        run: |
          # Drain any terminating pods from the previous revision first so the
          # subsequent readiness check only sees the newly-scheduled pods.
          kubectl wait pod -l app=ems-ops-backend  -n ems-ops --for=delete --timeout=60s 2>/dev/null || true
          kubectl wait pod -l app=ems-ops-frontend -n ems-ops --for=delete --timeout=60s 2>/dev/null || true
          # Confirm new pods are ready (rollout status already passed; this is
          # a belt-and-suspenders check against any race between deploy steps).
          kubectl wait --for=condition=ready pod -l app=ems-ops-backend  -n ems-ops --timeout=120s
          kubectl wait --for=condition=ready pod -l app=ems-ops-frontend -n ems-ops --timeout=120s
          echo "All pods are ready."
          kubectl get pods -n ems-ops -o wide
