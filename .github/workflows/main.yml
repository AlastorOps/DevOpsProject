name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev
      - 'feature/**'

jobs:
  build-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  build-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      SECRET_KEY: CI0GitHub0Actions0Backend0Test0A1B2C3
      ADMIN_PASSWORD: CIactions0AdminPw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --tb=short -q

  docker:
    name: Build & Push Docker Images
    needs: [build-frontend, build-backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "fe_tags=${{ secrets.DOCKER_USERNAME }}/employee-management-frontend:latest\n${{ secrets.DOCKER_USERNAME }}/employee-management-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "be_tags=${{ secrets.DOCKER_USERNAME }}/employee-management-backend:latest\n${{ secrets.DOCKER_USERNAME }}/employee-management-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "fe_tags=${{ secrets.DOCKER_USERNAME }}/employee-management-frontend:dev" >> $GITHUB_OUTPUT
            echo "be_tags=${{ secrets.DOCKER_USERNAME }}/employee-management-backend:dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ steps.tag.outputs.fe_tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tag.outputs.be_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
