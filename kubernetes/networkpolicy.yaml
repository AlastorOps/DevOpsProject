# NetworkPolicies restrict pod-to-pod communication to the minimum required.
# Requires a CNI plugin that enforces NetworkPolicy (e.g. Calico, Cilium, Weave).
# Minikube: minikube start --cni=calico

# ─── Default: deny all ingress AND egress within the namespace ────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# ─── Frontend: accept traffic from the nginx Ingress controller ───────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: ems-ops-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# ─── Backend: accept traffic from frontend pods only ─────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: ems-ops-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ems-ops-frontend
      ports:
        - protocol: TCP
          port: 8000
---
# ─── Backend: accept Prometheus scrape ────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-backend
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: ems-ops-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8000
---
# ─── Database: accept connections from backend only ───────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-database
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: ems-ops-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ems-ops-backend
      ports:
        - protocol: TCP
          port: 5432
---
# ─── Prometheus: accept from Grafana ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-prometheus
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
---
# ─── Egress: allow DNS for all pods (required for service discovery) ──────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ─── Egress: backend → database ──────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-to-db
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: ems-ops-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ems-ops-db
      ports:
        - protocol: TCP
          port: 5432
---
# ─── Egress: frontend → backend ──────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-to-backend
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: ems-ops-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ems-ops-backend
      ports:
        - protocol: TCP
          port: 8000
---
# ─── Egress: prometheus → backend (scrape) and node-exporter ─────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ems-ops-backend
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: node-exporter
      ports:
        - protocol: TCP
          port: 9100
---
# ─── Egress: grafana → prometheus ────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-egress-to-prometheus
  namespace: ems-ops
  labels:
    app.kubernetes.io/part-of: ems-ops
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
