apiVersion: v1
kind: Secret
metadata:
  name: ems-ops-secrets
  namespace: ems-ops
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-strong-postgres-password
  DATABASE_URL: postgresql://postgres:replace-with-strong-postgres-password@db:5432/emsops
  SECRET_KEY: replace-with-64-character-random-hex-string
  ADMIN_PASSWORD: replace-with-strong-admin-password
  GRAFANA_PASSWORD: replace-with-strong-grafana-admin-password
