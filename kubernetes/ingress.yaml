apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ems-ops-ingress
  namespace: ems-ops
  labels:
    app.kubernetes.io/name: ems-ops-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: ems-ops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # TLS — cert-manager will auto-provision the certificate named below.
  # Requires cert-manager installed: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
  tls:
    - hosts:
        - your-domain.com  # Replace with your actual domain
      secretName: ems-ops-tls
  rules:
    - host: your-domain.com  # Replace with your actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ems-ops-frontend-svc
                port:
                  number: 80
