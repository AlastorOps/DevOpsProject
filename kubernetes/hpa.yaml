# Horizontal Pod Autoscaler — requires metrics-server in the cluster.
# Install: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# Minikube: minikube addons enable metrics-server

# ─── Backend HPA ─────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ems-ops-backend-hpa
  namespace: ems-ops
  labels:
    app.kubernetes.io/name: ems-ops-backend-hpa
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ems-ops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ems-ops-backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
---
# ─── Frontend HPA ─────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ems-ops-frontend-hpa
  namespace: ems-ops
  labels:
    app.kubernetes.io/name: ems-ops-frontend-hpa
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ems-ops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ems-ops-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
