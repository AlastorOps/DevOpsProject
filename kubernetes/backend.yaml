apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-ops-backend
  namespace: ems-ops
  labels:
    app: ems-ops-backend
    app.kubernetes.io/name: ems-ops-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ems-ops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ems-ops-backend
  template:
    metadata:
      labels:
        app: ems-ops-backend
        app.kubernetes.io/name: ems-ops-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ems-ops
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL..."; sleep 2
              done
              echo "PostgreSQL is ready"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: alastorops/employee-management-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ems-ops-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ems-ops-secrets
                  key: SECRET_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ems-ops-secrets
                  key: ADMIN_PASSWORD
            - name: ALGORITHM
              value: "HS256"
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              value: "7"
            - name: CORS_ORIGINS
              # Replace with your actual production domain(s) — must match the Ingress host.
              value: '["https://ems-ops.xyz","https://www.ems-ops.xyz"]'
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: ENABLE_DOCS
              value: "false"
          volumeMounts:
            - name: upload-storage
              mountPath: /app/uploads
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: upload-storage
          persistentVolumeClaim:
            claimName: ems-ops-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  # Must match the hostname in frontend/nginx.conf: proxy_pass http://backend:8000/
  name: backend
  namespace: ems-ops
  labels:
    app: ems-ops-backend
    app.kubernetes.io/name: ems-ops-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ems-ops
spec:
  selector:
    app: ems-ops-backend
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ems-ops-uploads-pvc
  namespace: ems-ops
spec:
  # IMPORTANT: ReadWriteOnce allows only one node to mount this volume at a time.
  # If the backend HPA scales to >1 replica AND pods land on different nodes, the
  # second pod will remain Pending. Options:
  #   A) Keep ReadWriteOnce and accept single-replica uploads (set hpa.yaml maxReplicas: 1 for backend).
  #   B) Change to ReadWriteMany with an RWX-capable storage class (NFS, AWS EFS, CephFS).
  #   C) Move uploads to object storage (S3/MinIO) and remove this PVC entirely — recommended for production.
  # Single-node clusters (Minikube, k3s) can use ReadWriteOnce safely with multiple replicas.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
