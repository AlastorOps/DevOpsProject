apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-ops-backend
  namespace: ems-ops
  labels:
    app: ems-ops-backend
    app.kubernetes.io/name: ems-ops-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ems-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ems-ops-backend
  template:
    metadata:
      labels:
        app: ems-ops-backend
        app.kubernetes.io/name: ems-ops-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ems-ops
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL..."; sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: backend
          image: alastorops/employee-management-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ems-ops-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ems-ops-secrets
                  key: SECRET_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ems-ops-secrets
                  key: ADMIN_PASSWORD
            - name: ALGORITHM
              value: "HS256"
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              value: "7"
            - name: CORS_ORIGINS
              value: '["http://ems-ops.local","http://localhost:8080"]'
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: ENABLE_DOCS
              value: "false"
          volumeMounts:
            - name: upload-storage
              mountPath: /app/uploads
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: upload-storage
          persistentVolumeClaim:
            claimName: ems-ops-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  # Must match the hostname in frontend/nginx.conf: proxy_pass http://backend:8000/
  name: backend
  namespace: ems-ops
  labels:
    app: ems-ops-backend
    app.kubernetes.io/name: ems-ops-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ems-ops
spec:
  selector:
    app: ems-ops-backend
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ems-ops-uploads-pvc
  namespace: ems-ops
spec:
  # ReadWriteMany is required when replicas > 1 so all pods can mount the same volume.
  # Your cluster's storage class must support RWX (e.g. NFS, AWS EFS, CephFS).
  # For single-node clusters or local dev, change to ReadWriteOnce and set replicas: 1.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
