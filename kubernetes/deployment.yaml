apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-ops-frontend
  namespace: ems-ops
  labels:
    app: ems-ops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ems-ops-frontend
  template:
    metadata:
      labels:
        app: ems-ops-frontend
    spec:
      containers:
        - name: frontend
          image: alastorops/employee-management-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
