apiVersion: apps/v1
kind: Deployment
metadata:
  name: EMS-Ops-frontend
  namespace: EMS-Ops
  labels:
    app: EMS-Ops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: EMS-Ops-frontend
  template:
    metadata:
      labels:
        app: EMS-Ops-frontend
    spec:
      containers:
        - name: frontend
          # Update DOCKER_USERNAME to match your Docker Hub username
          # (same value as the DOCKER_USERNAME secret in GitHub Actions)
          image: DOCKER_USERNAME/employee-management-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
