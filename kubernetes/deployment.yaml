apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-ops-frontend
  namespace: ems-ops
  labels:
    app: ems-ops-frontend
    app.kubernetes.io/name: ems-ops-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ems-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ems-ops-frontend
  template:
    metadata:
      labels:
        app: ems-ops-frontend
        app.kubernetes.io/name: ems-ops-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: ems-ops
    spec:
      containers:
        - name: frontend
          image: alastorops/employee-management-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
