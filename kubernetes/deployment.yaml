apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-ops-frontend
  namespace: ems-ops
  labels:
    app: ems-ops-frontend
    app.kubernetes.io/name: ems-ops-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ems-ops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ems-ops-frontend
  template:
    metadata:
      labels:
        app: ems-ops-frontend
        app.kubernetes.io/name: ems-ops-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: ems-ops
    spec:
      containers:
        - name: frontend
          image: alastorops/employee-management-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101    # nginx user in nginxinc/nginx-unprivileged
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
