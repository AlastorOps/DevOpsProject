apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ems-ops-db
  namespace: ems-ops
  labels:
    app: ems-ops-db
    app.kubernetes.io/name: ems-ops-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ems-ops
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: ems-ops-db
  template:
    metadata:
      labels:
        app: ems-ops-db
        app.kubernetes.io/name: ems-ops-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ems-ops
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: emsops
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ems-ops-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "emsops"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "emsops"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  # Must match the hostname in DATABASE_URL: postgresql://postgres:...@db:5432/emsops
  name: db
  namespace: ems-ops
  labels:
    app: ems-ops-db
    app.kubernetes.io/name: ems-ops-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ems-ops
spec:
  selector:
    app: ems-ops-db
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
